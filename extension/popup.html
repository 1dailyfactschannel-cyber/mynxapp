<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mynx</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: #0a0a0f;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
    }
    .logo { font-size: 18px; }
    .title { font-size: 15px; font-weight: 700; flex: 1; }
    .pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .pill.unlocked { background: rgba(16,185,129,0.15); color: #34d399; }
    .pill.locked { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .pill.offline { background: rgba(100,116,139,0.2); color: #94a3b8; }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 0 10px;
      border-bottom: 1px solid #1f2937;
    }
    .tab {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab:hover { color: #94a3b8; }
    .tab.active { color: #10b981; border-bottom-color: #10b981; }
    .tab .count {
      display: inline-block;
      min-width: 16px;
      padding: 0 4px;
      margin-left: 4px;
      border-radius: 999px;
      background: #10b981;
      color: #0a0a0f;
      font-size: 10px;
    }

    .pane { padding: 12px 14px; min-height: 160px; max-height: 380px; overflow-y: auto; }
    .hidden { display: none; }

    .empty {
      padding: 28px 10px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 6px;
      border-radius: 8px;
    }
    .entry:hover { background: rgba(255,255,255,0.04); }
    .entry .meta { flex: 1; min-width: 0; }
    .entry .meta .t {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry .meta .u {
      color: #64748b;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry .actions { display: flex; gap: 4px; }

    button.btn {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      background: #10b981;
      color: #0a0a0f;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.btn:hover { background: #34d399; }
    button.btn:disabled { background: #1f2937; color: #64748b; cursor: not-allowed; }
    button.icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1f2937;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
    }
    button.icon-btn:hover { color: #10b981; border-color: #10b981; }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #111118;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #10b981; }

    .gen-output {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .gen-output input { font-family: ui-monospace, Consolas, monospace; }
    .gen-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .gen-row label { flex: 1; color: #94a3b8; font-size: 12px; }
    .gen-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .gen-checks label { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: 12px; }
    input[type="range"] { flex: 2; accent-color: #10b981; }
    input[type="checkbox"] { accent-color: #10b981; }

    .pwd-mask { font-family: ui-monospace, Consolas, monospace; color: #64748b; font-size: 12px; }
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 12px;
      border-radius: 999px;
      background: #10b981;
      color: #0a0a0f;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔐</div>
    <div class="title">Mynx</div>
    <div id="status-pill" class="pill offline">Offline</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="site">Site</button>
    <button class="tab" data-tab="all">All</button>
    <button class="tab" data-tab="generator">Generator</button>
    <button class="tab" data-tab="saved">Saved<span id="saved-count" class="count hidden">0</span></button>
  </div>

  <div id="pane-site" class="pane"></div>

  <div id="pane-all" class="pane hidden">
    <input id="search-input" type="text" placeholder="Search logins..." style="margin-bottom:8px" />
    <div id="all-list"></div>
  </div>

  <div id="pane-generator" class="pane hidden">
    <div class="gen-output">
      <input id="gen-password" type="text" readonly />
      <button id="gen-copy" class="icon-btn" title="Copy">⧉</button>
    </div>
    <div class="gen-row">
      <label>Length <span id="gen-length-val">20</span></label>
      <input id="gen-length" type="range" min="8" max="64" value="20" />
    </div>
    <div class="gen-checks">
      <label><input type="checkbox" id="gen-upper" checked /> Uppercase</label>
      <label><input type="checkbox" id="gen-lower" checked /> Lowercase</label>
      <label><input type="checkbox" id="gen-digits" checked /> Digits</label>
      <label><input type="checkbox" id="gen-symbols" checked /> Symbols</label>
    </div>
    <button id="gen-regen" class="btn" style="width:100%">Regenerate</button>
  </div>

  <div id="pane-saved" class="pane hidden"></div>

  <div id="toast" class="toast">Copied</div>

  <script src="popup.js"></script>
</body>
</html>
