name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # mynx-native-host идет в инсталлятор как sidecar (bundle.externalBin):
      # Tauri ждёт файл binaries/mynx-native-host-<target-triple>.exe до бандлинга.
      - name: Build native host binary
        working-directory: src-tauri
        run: cargo build --release --bin mynx-native-host

      - name: Stage sidecar binary
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item src-tauri/target/release/mynx-native-host.exe `
            src-tauri/binaries/mynx-native-host-x86_64-pc-windows-msvc.exe -Force

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mynx-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload native host artifact
        uses: actions/upload-artifact@v4
        with:
          name: mynx-native-host-x64
          path: src-tauri/target/release/mynx-native-host.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mynx-native-host.exe
          generate_release_notes: true
