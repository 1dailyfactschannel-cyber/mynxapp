<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <rect x="48" y="48" width="928" height="928" rx="192" ry="192" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Shield -->
  <path
    d="M512 232
       c96 48 168 72 260 84
       c8 112 -8 224 -52 320
       c-56 120 -152 196 -208 224
       c-56 -28 -152 -104 -208 -224
       c-44 -96 -60 -208 -52 -320
       c92 -12 164 -36 260 -84
       Z"
    fill="url(#shield)"
    filter="url(#glow)"
  />

  <!-- Lock body -->
  <rect x="404" y="512" width="216" height="180" rx="28" ry="28" fill="url(#lock)"/>

  <!-- Lock shackle -->
  <path
    d="M452 512
       v-64
       a60 60 0 0 1 120 0
       v64"
    fill="none"
    stroke="url(#lock)"
    stroke-width="40"
    stroke-linecap="round"
  />

  <!-- Keyhole -->
  <circle cx="512" cy="590" r="28" fill="#0f172a"/>
  <path d="M496 614 h32 v56 h-32 Z" fill="#0f172a"/>
</svg>
